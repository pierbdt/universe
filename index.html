<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>git init universe</title>
  <meta name="description" content="The Universe Is Running on Git (And Quantum Mechanics Proves It)">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.8;
    }

    article {
      max-width: 720px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    h1 {
      color: #f0f6fc;
      font-size: 2.2em;
      line-height: 1.3;
      margin-bottom: 1.5em;
      font-weight: 700;
    }

    h2 {
      color: #f0f6fc;
      font-size: 1.5em;
      margin-top: 2.5em;
      margin-bottom: 0.8em;
      padding-bottom: 0.3em;
      border-bottom: 1px solid #21262d;
    }

    p {
      margin-bottom: 1.2em;
    }

    blockquote {
      border-left: 3px solid #58a6ff;
      padding: 0.5em 1em;
      margin: 1.5em 0;
      color: #f0f6fc;
      background: #161b22;
      border-radius: 0 6px 6px 0;
    }

    code {
      font-family: 'SF Mono', 'Fira Code', 'Fira Mono', Menlo, Consolas, monospace;
      background: #161b22;
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-size: 0.88em;
    }

    pre {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 20px;
      overflow-x: auto;
      margin: 1.5em 0;
    }

    pre code {
      background: none;
      padding: 0;
      font-size: 0.85em;
      line-height: 1.6;
      color: #8b949e;
    }

    strong {
      color: #f0f6fc;
    }

    a {
      color: #58a6ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      body { font-size: 16px; }
      article { padding: 40px 16px; }
      h1 { font-size: 1.7em; }
    }
  </style>
</head>
<body>
  <article id="content"></article>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('article.md')
      .then(r => r.text())
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
      });
  </script>
</body>
</html>
